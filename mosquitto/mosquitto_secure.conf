# Mosquitto configuration WITH usernames, passwords and an access control list.
#
# Start the broker from the PROJECT folder (the one containing README.md):
#     "C:\Program Files\mosquitto\mosquitto.exe" -c mosquitto\mosquitto_secure.conf -v
# The two file paths below are relative to the folder you start the broker in.

listener 1883

# Refuse clients that do not log in.
allow_anonymous false

# Usernames and hashed passwords, created with mosquitto_passwd (README section 15).
password_file mosquitto/passwd

# Which user may read or write which topics.
acl_file mosquitto/acl